name: Build GeoPort Live Drag for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-live-drag.yml

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out live-drag source
        uses: actions/checkout@v4
        with:
          ref: live-drag

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller flask requests pycountry psutil pyuac pymobiledevice3

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name "GeoPort-Windows-v4.0.2-LiveDrag" `
            --add-data "src/templates;templates" `
            --collect-all pymobiledevice3 `
            --collect-all pycountry `
            --collect-all flask `
            --recursive-copy-metadata pymobiledevice3 `
            --copy-metadata pyimg4 `
            --hidden-import pyi_splash `
            src/main.py

      - name: Smoke-test executable startup
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "geoport-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "geoport-stderr.txt"
          $process = Start-Process -FilePath ".\\dist\\GeoPort-Windows-v4.0.2-LiveDrag.exe" `
            -ArgumentList "--no-browser", "--port", "54322" `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) {
            Write-Host "GeoPort exited during startup."
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "GeoPort startup smoke test failed."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "GeoPort remained running for 15 seconds."

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GeoPort-Windows-v4.0.2-LiveDrag
          path: dist/GeoPort-Windows-v4.0.2-LiveDrag.exe
          if-no-files-found: error
          retention-days: 7
